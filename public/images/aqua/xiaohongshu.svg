<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b7a"/>
      <stop offset="42%" stop-color="#e31c34"/>
      <stop offset="100%" stop-color="#9b0d1c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#4a0008" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#body)" filter="url(#soft)"/>
  <rect x="16" y="14" width="96" height="42" rx="20" fill="url(#shine)"/>
  <text x="64" y="78" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#fff" letter-spacing="1">RED</text>
</svg>
